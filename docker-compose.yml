services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: movieticket_api
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      RUN_SEEDERS: "false"
    networks:
      - movieticket_net

  nginx:
    image: nginx:1.25-alpine
    container_name: movieticket_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - movieticket_net

  postgres:
    image: postgres:16-alpine
    container_name: movieticket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: movieticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movieticket"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - movieticket_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: movieticket_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - movieticket_net

volumes:
  pgdata:

networks:
  movieticket_net:
    driver: bridge